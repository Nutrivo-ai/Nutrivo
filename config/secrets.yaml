# Canonical secret names. envs: where the name must exist. check: the doctor check that proves it works.
# from: the task that creates the resource. env-check lists such a name as 'later', not missing, unless run with
# ALL=1 (make env-check ENV=staging ALL=1), which that task does once the resource exists.
# Values live only in Infisical. Map names you already use in config/secret-aliases.env.
secrets:
  - {name: SUPABASE_URL, envs: [staging, prod], used_by: [web, worker], check: supabase}
  - {name: SUPABASE_ANON_KEY, envs: [staging, prod], used_by: [web], check: supabase}
  - {name: SUPABASE_SERVICE_ROLE_KEY, envs: [staging, prod], used_by: [worker, admin routes], check: supabase}
  - {name: SUPABASE_PROJECT_REF, envs: [staging, prod], used_by: [deploy], check: supabase}
  - {name: SUPABASE_DB_PASSWORD, envs: [staging, prod], used_by: [deploy], check: postgres}
  - {name: SUPABASE_ACCESS_TOKEN, envs: [staging, prod], used_by: [deploy], check: supabase-management}
  - {name: DATABASE_URL, envs: [staging, prod], used_by: [worker], check: postgres}
  - {name: AWS_REGION, envs: [dev, staging, prod], used_by: [worker], check: bedrock}
  - {name: AWS_ACCESS_KEY_ID, envs: [dev, staging, prod], used_by: [worker], check: bedrock}
  - {name: AWS_SECRET_ACCESS_KEY, envs: [dev, staging, prod], used_by: [worker], check: bedrock}
  - {name: BEDROCK_MODEL_JUDGEMENT, envs: [dev, staging, prod], used_by: [worker], check: bedrock}
  - {name: BEDROCK_MODEL_TRIAGE, envs: [dev, staging, prod], used_by: [worker], check: bedrock}
  - {name: BEDROCK_MODEL_EXTRACTION, envs: [dev, staging, prod], used_by: [worker], check: bedrock}
  - {name: SES_FROM_ADDRESS, envs: [staging, prod], used_by: [worker], check: ses}
  - {name: ANTHROPIC_API_KEY, envs: [dev], used_by: [GitHub autopilot, model fallback], check: anthropic}
  - {name: STRIPE_SECRET_KEY, envs: [dev, staging, prod], used_by: [worker, web server], check: stripe}
  - {name: STRIPE_PUBLISHABLE_KEY, envs: [dev, staging, prod], used_by: [web], check: stripe}
  - {name: STRIPE_WEBHOOK_SECRET, envs: [staging, prod], used_by: [stripe-webhook function], check: present}
  - {name: SENTRY_DSN_WEB, envs: [dev, staging, prod], used_by: [web], check: sentry}
  - {name: SENTRY_DSN_WORKER, envs: [dev, staging, prod], used_by: [worker], check: sentry}
  - {name: SENTRY_AUTH_TOKEN, envs: [dev, staging, prod], used_by: [CI source maps, doctor], check: sentry}
  - {name: SENTRY_ORG, envs: [dev, staging, prod], used_by: [CI, doctor], check: sentry}
  - {name: SENTRY_PROJECT_WEB, envs: [dev, staging, prod], used_by: [CI, doctor], check: sentry}
  - {name: SENTRY_PROJECT_WORKER, envs: [dev, staging, prod], used_by: [CI, doctor], check: sentry}
  - {name: LANGFUSE_PUBLIC_KEY, envs: [dev, staging, prod], used_by: [worker], check: langfuse}
  - {name: LANGFUSE_SECRET_KEY, envs: [dev, staging, prod], used_by: [worker], check: langfuse}
  - {name: LANGFUSE_BASE_URL, envs: [dev, staging, prod], used_by: [worker], check: langfuse}
  - {name: POSTHOG_KEY, envs: [staging, prod], used_by: [web], check: posthog}
  - {name: POSTHOG_HOST, envs: [staging, prod], used_by: [web], check: posthog}
  - {name: VERCEL_TOKEN, envs: [staging, prod], used_by: [deploy], check: vercel}
  - {name: VERCEL_ORG_ID, envs: [staging, prod], used_by: [deploy], check: vercel}
  - {name: VERCEL_PROJECT_ID, envs: [staging, prod], from: T-010, used_by: [deploy], check: vercel}
  - {name: RENDER_API_KEY, envs: [staging, prod], used_by: [deploy], check: render}
  - {name: RENDER_WORKER_SERVICE_ID, envs: [staging, prod], from: T-010, used_by: [deploy], check: render}
  - {name: APP_BASE_URL, envs: [staging, prod], from: T-010, used_by: [smoke tests, emails], check: app}
  - {name: SYNTHETIC_USER_EMAIL, envs: [staging, prod], from: T-010, used_by: [smoke tests], check: present}
  - {name: SYNTHETIC_USER_PASSWORD, envs: [staging, prod], from: T-010, used_by: [smoke tests], check: present}
  # D-27 (T-109): the local stack's Google and Microsoft OAuth clients, read by supabase/config.toml when started through
  # scripts/env/run.sh dev -- supabase start. Staging and production keep theirs in each project's Auth settings.
  - {name: GOOGLE_OAUTH_CLIENT_ID, envs: [dev], optional: true, used_by: [local Supabase Auth], check: present}
  - {name: GOOGLE_OAUTH_CLIENT_SECRET, envs: [dev], optional: true, used_by: [local Supabase Auth], check: present}
  - {name: AZURE_OAUTH_CLIENT_ID, envs: [dev], optional: true, used_by: [local Supabase Auth], check: present}
  - {name: AZURE_OAUTH_CLIENT_SECRET, envs: [dev], optional: true, used_by: [local Supabase Auth], check: present}
  - {name: GOOGLE_SERVICE_ACCOUNT_JSON, envs: [], optional: true, used_by: [design download], check: present}
