<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today · mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
a{color:#2f5eff}a:hover{color:#1f49d9}
:focus-visible{outline:2px solid #2f5eff;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;box-sizing:border-box;font-family:'Instrument Sans',system-ui,sans-serif;color:#101216;background:#ffffff">
<header style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #dde0e6">
<span style="font-weight:700;font-size:17px">Nutrivo</span>
<button aria-label="Open menu" style="all:unset;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#101216" stroke-width="1.6" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14"></path></svg></button>
</header>
<div style="padding:20px 16px 8px;display:flex;flex-direction:column;gap:4px">
<span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5f6570;text-transform:uppercase;letter-spacing:0.08em">Today · Thu 26 Nov</span>
<h1 style="margin:0;font-size:24px;font-weight:600;letter-spacing:-0.01em">Halden Pet Nutrition</h1>
<h2 style="margin:6px 0 0;font-size:15px;font-weight:600">6 open items</h2>
</div>
<ol style="list-style:none;margin:0;padding:8px 16px 32px;display:flex;flex-direction:column;gap:12px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<li style="border:1px solid #dde0e6;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
<div>
<sc-if value="{{r.isBlocked}}" hint-placeholder-val="{{false}}"><span style="display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;background:#fbe8e7;color:#b3251f;font-size:13px;font-weight:600"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="6.5"></circle><path d="M3.5 12.5l9-9"></path></svg>Blocked</span></sc-if>
<sc-if value="{{r.isAction}}" hint-placeholder-val="{{true}}"><span style="display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;background:#fdf0dd;color:#9e5600;font-size:13px;font-weight:600"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 1.8l6.6 12H1.4z"></path><path d="M8 6.5v3.2M8 11.6v.4"></path></svg>Action needed</span></sc-if>
<sc-if value="{{r.isDoc}}" hint-placeholder-val="{{false}}"><span style="display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;background:#f4f5f7;font-size:13px;font-weight:500"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 1.8h5.5L12.5 5v9.2H4z"></path><path d="M9.5 1.8V5h3"></path></svg>Document</span></sc-if>
<sc-if value="{{r.isRule}}" hint-placeholder-val="{{false}}"><span style="display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;background:#f4f5f7;font-size:13px;font-weight:500"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 13.5h11M4 13.5V6.5M8 13.5V6.5M12 13.5V6.5M1.8 6.5L8 2.5l6.2 4z"></path></svg>Rule change</span></sc-if>
</div>
<span style="font-family:'IBM Plex Mono',monospace;font-size:12px;padding:2px 7px;border:1px solid #dde0e6;border-radius:6px;background:#f4f5f7">{{r.market}}</span>
</div>
<span style="font-size:16px;font-weight:600;line-height:1.3">{{r.title}}</span>
<span style="font-size:14px;color:#5f6570;line-height:1.4">{{r.reason}}</span>
<span style="font-size:14px;font-weight:500">{{r.product}}</span>
<span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5f6570">{{r.cite}} · {{r.prov}}</span>
<button style="font:inherit;font-size:15px;font-weight:600;min-height:44px;margin-top:4px;border:0;border-radius:8px;background:#2f5eff;color:#ffffff;cursor:pointer">{{r.action}}</button>
</li>
</sc-for>
</ol>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2000}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (t, o) => Object.assign({ isBlocked: t === 'b', isAction: t === 'a', isDoc: t === 'd', isRule: t === 'r' }, o);
    return {
      rows: [
        row('b', { title: 'Registration expired in Finland', reason: 'Sale in Finland is blocked until the registration is renewed.', cite: 'Registration · Expired', prov: 'Registry', product: 'Duck Training Treats 150 g', market: 'FI', action: 'Open registration' }),
        row('a', { title: 'Type of feed missing', reason: 'The required term “Alleinfuttermittel” is not printed on the German panel.', cite: 'Reg. (EC) 767/2009 Art. 17(1)(a)', prov: 'EU law', product: 'Salmon & Rice Adult 12 kg', market: 'DE · German', action: 'Open fix' }),
        row('a', { title: 'Additive without identification number', reason: 'Vitamin D3 is listed under additives without its identification number.', cite: 'Reg. (EC) 767/2009 Annex VII ch. I', prov: 'EU law', product: 'Indoor Cat Chicken 2 kg', market: 'SE · Swedish', action: 'Open fix' }),
        row('a', { title: 'Analytical constituents in English only', reason: 'The German panel prints analytical constituents in English, not German.', cite: 'Reg. (EC) 767/2009 Art. 14(1)', prov: 'EU law', product: 'Lamb & Potato Senior 6 kg', market: 'DE · German', action: 'Open fix' }),
        row('d', { title: 'Supplier specification expiring', reason: 'Salmon meal specification from [supplier] expires [date].', cite: 'Supplier document', prov: 'Uploaded', product: 'Salmon & Rice Adult 12 kg', market: 'All 4', action: 'Request document' }),
        row('r', { title: 'Encoded rule updated', reason: 'Additive labelling rule changes on [effective date]. Checked against the earlier version.', cite: 'Reg. (EC) 767/2009 Annex VII ch. I', prov: 'EU law', product: 'Joint Support Mixer 400 g', market: 'SE · Swedish', action: 'Re-check' })
      ]
    };
  }
}
</script>
</body>
</html>
