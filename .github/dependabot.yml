version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows and a root action.yml only; the Infisical pin lives in the composite action.
    directories: ["/", "/.github/actions/*"]
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: uv
    directory: /worker
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /worker
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups: { all: { patterns: ["*"] } }
    # Majors held until the toolchain supports them (founder decision, 26 Oct 2026): typescript-eslint does not support
    # TypeScript 7, eslint-config-next is not ready for eslint 10, and @types/node follows the Node 22 engine.
    ignore:
      - { dependency-name: "typescript", update-types: ["version-update:semver-major"] }
      - { dependency-name: "eslint", update-types: ["version-update:semver-major"] }
      - { dependency-name: "@types/node", update-types: ["version-update:semver-major"] }
