version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows and a root action.yml only; the Infisical pin lives in the composite action.
    directories: ["/", "/.github/actions/*"]
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: uv
    directory: /worker
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /worker
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups: { all: { patterns: ["*"] } }
