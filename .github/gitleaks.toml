# gitleaks configuration for the secrets-scan CI job: the default rules plus one narrow allowlist.
[extend]
useDefault = true

[[allowlists]]
description = "Rule keys in regulatory content (key: EU.767.NET_QUANTITY) are identifiers, not secrets"
regexTarget = "match"
regexes = ['''key:\s*[A-Z]{2}\.[0-9A-Z-]+\.[A-Z0-9_.]+''']

[[allowlists]]
description = "T-008 test fixtures shaped like keys (fake Langfuse key, token and JWT), replaced in 74fc6a6; the commit stays in history (#105)"
commits = ["214bee482b1f8507e9cecfbcf914d815050c3ce3"]
