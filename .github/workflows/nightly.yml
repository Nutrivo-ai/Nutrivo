name: nightly
on:
  schedule: [{ cron: "0 2 * * *" }]
  workflow_dispatch:
permissions: { contents: read, issues: write, actions: write }

jobs:
  staging-acceptance:
    if: vars.STAGING_DEPLOY_ENABLED == 'true'      # staging exists from T-010 (gate G7)
    environment: staging                            # the staging Infisical identity is an environment secret
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/infisical
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          env-slug: staging
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with: { version: 2.120.0 }
      - run: sudo apt-get update && sudo apt-get install -y ghostscript poppler-utils fonts-dejavu-core
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { version: 10 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      # The same set-up as staging-load: the web's packages (Playwright) and the synthetic artworks the specs upload.
      - name: Web packages and synthetic fixtures
        run: |
          pnpm --dir apps/web install --frozen-lockfile
          (cd worker && uv sync && uv run python ../fixtures/synth/generate.py --out ../fixtures/synth/out && touch ../fixtures/synth/out/.built)
      - name: Full acceptance suite against staging (real models, real email)
        run: make acceptance-staging
      - name: Doctor for every environment
        run: |
          uv run --no-project --with boto3 python scripts/doctor/doctor.py --env staging
      - name: Schema drift (staging must equal the migrations)
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"
          diff="$(supabase db diff --linked -s app,ref,private,public)"   # a failed diff fails the step
          test -z "$(printf '%s\n' "$diff" | grep -v '^--' | grep -v '^$')"
      - name: Dependency audit
        run: |
          (cd worker && uv export --frozen --no-hashes --no-emit-project --format requirements-txt > /tmp/worker-requirements.txt \
            && uvx pip-audit -r /tmp/worker-requirements.txt --disable-pip --no-deps)
          if [ -f apps/web/package.json ]; then pnpm --dir apps/web audit --prod --audit-level high; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: nightly-reports, path: reports/ }
      - name: Conformance on staging
        if: always()
        run: uv run --no-project --with pyyaml python scripts/conformance/report.py --results 'reports/**/*.xml' --summary "$GITHUB_STEP_SUMMARY"
      - name: Issue for the autopilot
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          url=$(gh issue create --title "Nightly failed $(date -u +%F)" --label nightly,autopilot \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Find the failing step, reproduce locally, fix the root cause.")
          gh workflow run claude-autopilot.yml -f issue="${url##*/}"

  # T-1102: one check-in to the Sentry monitor nightly-staging after both jobs, ok only when both passed: a failed night
  # is an error check-in and a night that never ran is a missed one (config/monitors.yaml, docs/17). Only once staging
  # exists, like the jobs it watches, so Sentry never expects a run that nothing makes.
  monitor:
    if: ${{ !cancelled() && vars.STAGING_DEPLOY_ENABLED == 'true' }}
    needs: [staging-acceptance, staging-load]
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/infisical
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          env-slug: staging
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # The schedule is the workflow's; the margin covers both jobs' timeouts (90 + 120 min) and a late start.
      - name: Check in to nightly-staging
        env:
          ACCEPTANCE: ${{ needs.staging-acceptance.result }}
          LOAD: ${{ needs.staging-load.result }}
        run: >
          SENTRY_DSN="$SENTRY_DSN_WEB" npx --yes @sentry/cli@3.8.0 monitors run -e staging
          -s "0 2 * * *" --check-in-margin 300 --max-runtime 10 --failure-issue-threshold 1 --recovery-threshold 1
          nightly-staging -- test "$ACCEPTANCE/$LOAD" = success/success

  # T-1105: every budget in spec/nfr.yaml under full load against staging (config/load/profiles.yaml, staging;
  # docs/21 §3). Seeds its own "Load test staging <time>" workspace through the service role. Runs only here, never from
  # a session or a laptop (scripts/load/run.sh refuses outside GitHub Actions).
  staging-load:
    # Staging exists from T-010 (gate G7). After the acceptance suite, not beside it, and whether or not it passed.
    if: ${{ !cancelled() && vars.STAGING_DEPLOY_ENABLED == 'true' }}
    needs: staging-acceptance
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/infisical
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          env-slug: staging
      - run: sudo apt-get update && sudo apt-get install -y ghostscript poppler-utils fonts-dejavu-core
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { version: 10 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - name: Every budget under load against staging
        run: |
          pnpm --dir apps/web install --frozen-lockfile
          (cd worker && uv sync && uv run python ../fixtures/synth/generate.py --out ../fixtures/synth/out && touch ../fixtures/synth/out/.built)
          make load PROFILE=staging
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: { name: nightly-load, path: reports/ }
      - name: Issue for the autopilot
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh issue create --title "Nightly load budgets failed $(date -u +%F)" --label nightly \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. reports/LOAD.md in the nightly-load artifact names each budget that was exceeded or not measured."
