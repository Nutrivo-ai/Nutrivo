name: doctor
# Staging in T-010 and prod in T-1101 (bootstrap checks dev only). Claude Code sessions hold only the dev Infisical
# identity, so a founder runs this from Actions → doctor → Run workflow; it checks the names (config/secrets.yaml) and
# the services inside the GitHub environment that holds that environment's identity. Names only, never a value; prod
# is read-only.
on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        type: choice
        options: [staging, prod]
        required: true
      all:
        description: Also require the names a later task creates (from T-010, as make env-check ALL=1)
        type: boolean
        default: false
permissions: { contents: read }

jobs:
  doctor:
    environment: ${{ inputs.env == 'prod' && 'production' || 'staging' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/infisical
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          env-slug: ${{ inputs.env }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Names present in Infisical
        run: uv run --no-project --with pyyaml python scripts/env/check-secrets.py --env "${{ inputs.env }}" ${{ inputs.all && '--all' || '' }}
      - name: Services answer with the stored keys
        run: uv run --no-project --with boto3 python scripts/doctor/doctor.py --env "${{ inputs.env }}" ${{ inputs.env == 'prod' && '--readonly' || '' }}
