name: protocol
# The required 'protocol' check, apart from ci so that a label (scope-approved, human-approved) or a corrected
# 'Task:'/'Closes #' line re-runs it without a push. check-pr.py reads the labels and body at run time.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  merge_group:
  push:
    branches: [main]
concurrency:
  group: protocol-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  protocol:
    name: protocol
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # The base commit's checker and migration guard, before any of the PR's code runs in this job (an earlier step
      # could rewrite $GITHUB_ENV or the runner), so a PR cannot loosen the rules it is checked by. scripts/protocol/
      # is replaced whole (a module the PR adds there would shadow an import); uv starts outside the checkout with no
      # config or cache, so no .venv, uv.toml or .python-version the PR adds, nor anything an earlier run of it
      # cached, is used. This file comes from the PR: edits to it rest on code review.
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          rm -rf scripts/protocol && git checkout "$BASE_SHA" -- scripts/protocol/
          cd "$RUNNER_TEMP" && uv run --no-project --no-config --no-cache --with pyyaml python "$GITHUB_WORKSPACE/scripts/protocol/check-pr.py"
      - run: bash scripts/protocol/migration-guard.sh "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}"
      # Then the PR's own copy, for the checks it may change along with the plan.
      - if: github.event_name == 'pull_request'
        run: rm -rf scripts/protocol && git restore --source=HEAD --staged --worktree -- scripts/protocol
      - run: uv run --no-project --with pyyaml python scripts/protocol/validate-plan.py
      - run: uv run --no-project --with pyyaml python -m unittest discover -s scripts/protocol -p 'test_*.py'
      - run: uv run --no-project --with pyyaml python scripts/workflows/render.py --check
      # The repository scripts' own tests, including that config/secret-aliases.env parses (names only, no secrets).
      - run: python3 -m unittest discover -s scripts/env -p 'test_*.py'
