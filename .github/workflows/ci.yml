name: ci
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source /repo --config /repo/.github/gitleaks.toml --no-banner --redact -v

  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with: { version: 2.120.0 }
      - run: supabase db start
      - run: supabase test db
      - name: Per-test TAP for the conformance report
        run: |
          mkdir -p reports
          for f in $(find supabase/tests -name '*.sql' | sort); do psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -Atq -f "$f"; done > reports/database.tap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: reports-database, path: reports/ }

  worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y ghostscript poppler-utils fonts-dejavu-core
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: cd worker && uv sync
      - run: cd worker && uv run python ../fixtures/synth/generate.py --out ../fixtures/synth/out
      - run: cd worker && uv run ruff check . && mkdir -p ../reports && uv run pytest -q --junitxml=../reports/worker.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: reports-worker, path: reports/ }

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: app
        run: if [ -f apps/web/package.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.app.outputs.ready == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with: { version: 10 }
      - if: steps.app.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - if: steps.app.outputs.ready == 'true'
        run: pnpm --dir apps/web install --frozen-lockfile && pnpm --dir apps/web lint && pnpm --dir apps/web typecheck && pnpm --dir apps/web test && pnpm --dir apps/web build

  e2e:
    needs: [database, worker, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: app
        run: if [ -f apps/web/package.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.app.outputs.ready == 'true'
        run: sudo apt-get update && sudo apt-get install -y ghostscript poppler-utils fonts-dejavu-core
      - if: steps.app.outputs.ready == 'true'
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with: { version: 2.120.0 }
      - if: steps.app.outputs.ready == 'true'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - if: steps.app.outputs.ready == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with: { version: 10 }
      - if: steps.app.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - if: steps.app.outputs.ready == 'true'
        run: supabase start && make e2e-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: reports-e2e, path: reports/ }

  conformance:
    needs: [database, worker, e2e]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { pattern: reports-*, path: reports, merge-multiple: true }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv run --no-project --with pyyaml python scripts/conformance/report.py --results 'reports/**/*.xml' 'reports/**/*.tap' --enforce --summary "$GITHUB_STEP_SUMMARY"
