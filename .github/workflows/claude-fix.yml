name: claude-fix
# When CI fails on an autopilot pull request, Claude Code reads the failure and pushes a fix. Three attempts, then a person.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions: { contents: write, pull-requests: write, issues: write, actions: read, id-token: write }

jobs:
  fix:
    # Same-repository branches only: the branch's own .github/actions and Makefile run with the dev secrets. Skipped,
    # not red, until docs/22 §3 has stored the Infisical identity and INFISICAL_PROJECT_ID.
    if: >
      github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository && vars.INFISICAL_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env: { NUTRIVO_STOP_VERIFY: "1" }   # this job starts the stack, so the Stop hook runs make verify-fast here
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number,labels --jq '.[0] // empty')
          [ -z "$pr" ] && { echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          num=$(echo "$pr" | jq -r .number); labels=$(echo "$pr" | jq -r '[.labels[].name] | join(",")')
          case ",$labels," in *,autopilot,*) ;; *) echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0;; esac
          attempts=$(echo "$labels" | tr ',' '\n' | grep -c '^fix-attempt-' || true)
          if [ "$attempts" -ge 3 ]; then gh pr edit "$num" --repo "$REPO" --add-label needs-human; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          next=$((attempts + 1)); gh label create "fix-attempt-$next" --repo "$REPO" --force >/dev/null
          gh pr edit "$num" --repo "$REPO" --add-label "fix-attempt-$next"
          gh run view ${{ github.event.workflow_run.id }} --repo "$REPO" --log-failed | tail -n 400 > /tmp/ci-failure.log || true
          echo "number=$num" >> "$GITHUB_OUTPUT"; echo "attempt=$next" >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.event.workflow_run.head_branch }}", fetch-depth: 0 }
      - if: steps.pr.outputs.skip != 'true'
        uses: ./.github/actions/infisical
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          env-slug: dev
      - if: steps.pr.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y ghostscript poppler-utils fonts-dejavu-core
      - if: steps.pr.outputs.skip != 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with: { version: 2.120.0 }
      - if: steps.pr.outputs.skip != 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - if: steps.pr.outputs.skip != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10 }
      - if: steps.pr.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - if: steps.pr.outputs.skip != 'true'
        run: supabase start
      - if: steps.pr.outputs.skip != 'true'
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          allowed_bots: claude          # autopilot pull requests are opened and pushed by claude[bot]
          # Agent mode grants no file edits by default (tag mode adds the same flag itself).
          claude_args: "--model claude-opus-5-5 --max-turns 200 --permission-mode acceptEdits"
          prompt: |
            CI failed on pull request #${{ steps.pr.outputs.number }} (attempt ${{ steps.pr.outputs.attempt }} of 3).
            The failing log tail is in /tmp/ci-failure.log. Follow CLAUDE.md and docs/15-build-protocol.md: find the
            root cause and fix the implementation. Never weaken, skip or delete a test, never edit protected files,
            never print secrets. Run make verify-fast, commit "fix: <what>" and push to this branch. If the fix needs
            a decision that is not written down, comment on the pull request and stop.
