name: deploy-staging
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: deploy-staging, cancel-in-progress: false }
permissions: { contents: read, issues: write, actions: write }

jobs:
  deploy:
    # Off until T-010: a founder sets the repository variable STAGING_DEPLOY_ENABLED=true when approving the first
    # staging deployment (gate G7). Until then a merge to main must not run migrations against nutrivo-staging.
    if: vars.STAGING_DEPLOY_ENABLED == 'true'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/infisical
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          env-slug: staging
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with: { version: 2.120.0 }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Database migrations (expand/contract only)
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" -p "$SUPABASE_DB_PASSWORD" && supabase db push -p "$SUPABASE_DB_PASSWORD"
      - name: Edge Functions
        run: if [ -d supabase/functions ]; then supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"; fi
      - name: Worker on Render
        run: bash scripts/deploy/render.sh "$RENDER_WORKER_SERVICE_ID" "$GITHUB_SHA"
      - name: Web on Vercel
        run: if [ -f apps/web/package.json ]; then bash scripts/deploy/vercel.sh staging; fi
      - name: Smoke tests on staging
        run: make smoke ENV=staging
      - name: Observability round-trip and doctor
        run: uv run --no-project --with boto3 python scripts/doctor/doctor.py --env staging
      - name: Roll back
        if: failure()
        run: bash scripts/deploy/rollback.sh staging
      - name: Incident issue for the autopilot
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          url=$(gh issue create --title "Staging deploy failed at ${GITHUB_SHA::7}" --label incident,autopilot \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Rolled back. Find the root cause and fix forward (docs/18-reliability.md).")
          gh workflow run claude-autopilot.yml -f issue="${url##*/}"
