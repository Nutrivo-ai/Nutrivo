name: claude-autopilot
# Requires the Claude GitHub App on the repository (/install-github-app) so its pull requests trigger CI.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue: { description: "Issue number to work on", required: true }
permissions: { contents: write, pull-requests: write, issues: write, id-token: write, actions: read }

jobs:
  # Both jobs are skipped, not red, until docs/22 §3 has stored the Infisical identity and INFISICAL_PROJECT_ID.
  build:
    if: >
      vars.INFISICAL_PROJECT_ID != '' && (
      (github.event_name == 'issues' && github.event.label.name == 'autopilot') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env: { NUTRIVO_STOP_VERIFY: "1" }   # this job starts the stack, so the Stop hook runs make verify-fast here
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/infisical
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          env-slug: dev
      - run: sudo apt-get update && sudo apt-get install -y ghostscript poppler-utils fonts-dejavu-core
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with: { version: 2.120.0 }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: supabase start
      - uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          # track_progress throws on workflow_dispatch, which deploy-staging and nightly send with GITHUB_TOKEN
          # (actor github-actions[bot]). Agent mode, used on dispatch, grants no file edits without acceptEdits.
          track_progress: ${{ github.event_name == 'issues' }}
          allowed_bots: github-actions
          claude_args: "--model claude-opus-5-5 --max-turns 300 --permission-mode acceptEdits"
          prompt: |
            Work on issue #${{ github.event.issue.number || inputs.issue }} of ${{ github.repository }}.
            If it is a task (title starts with T-), follow scripts/autopilot/task-prompt.md with TASK_ID from the
            title, ISSUE = the issue number, and BRANCH = t/<TASK_ID>-<short-name>; first assign the issue to
            yourself, and skip it if it is already assigned to someone else or has open dependencies.
            If it is an incident or nightly issue, find the root cause from the linked run, fix it on a branch
            fix/<issue-number>, and open a pull request whose body has the lines "Incident: #<issue-number>" and
            "Closes #<issue-number>". After opening any pull request (task or incident), run
            `gh pr edit <pr-number> --add-label autopilot` so that the CI fixer (claude-fix) picks it up.
            Follow CLAUDE.md throughout.

  respond:
    if: >
      vars.INFISICAL_PROJECT_ID != '' &&
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: ./.github/actions/infisical
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          env-slug: dev
      - uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-opus-5-5 --max-turns 120"
