name: restore-drill
# T-1101, gate G7 (docs/18 Backups, docs/runbooks/restore-drill.md). Monthly, by hand: a founder restores nutrivo-prod
# into a new project from the Supabase dashboard (the Management API cannot restore into a new project), then runs this
# with that project's ref. scripts/drill/restore_drill.py refuses any project that is not a fresh drill copy, compares
# the copy with prod using aggregates only, deletes the copy when the drill passes, and this job records the drill in
# an issue labelled restore-drill. Nothing leaves Supabase's EU region: counts and timestamps only, never rows.
# Two things keep it monthly (docs/17): the drill checks in to the Sentry monitor restore-drill-prod, which expects one
# by the 15th of each month, and on the 2nd a scheduled run opens a reminder issue if no drill has passed for 31 days.
on:
  schedule: [{ cron: "37 8 2 * *" }]
  workflow_dispatch:
    inputs:
      drill_ref:
        description: Ref of the project "Restore to a New Project" created (never nutrivo-prod's)
        type: string
        required: true
      restore_point:
        description: The point in time chosen in the dashboard, ISO 8601 UTC (e.g. 2026-12-01T06:00:00Z)
        type: string
        required: true
      keep:
        description: Keep the copy after a passing drill (it is always kept after a failing one)
        type: boolean
        default: false
concurrency: { group: restore-drill, cancel-in-progress: false }
permissions: { contents: read, issues: write }

jobs:
  remind:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Remind when no drill passed in the last 31 days
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          since=$(date -u -d '31 days ago' +%Y-%m-%d)
          passed=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --label restore-drill \
            --search "in:title passed created:>=$since" --json number --jq length)
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label restore-drill \
            --search 'in:title "Restore drill due"' --json number --jq length)
          if [ "$passed" -gt 0 ] || [ "$open" -gt 0 ]; then echo "drill passed since $since, or a reminder is open"; exit 0; fi
          gh label create restore-drill --repo "$GITHUB_REPOSITORY" --color 0e8a16 --force >/dev/null
          gh issue create --repo "$GITHUB_REPOSITORY" --label restore-drill,needs-human \
            --title "Restore drill due ($(date -u +%B\ %Y))" \
            --body "No restore drill has passed since $since. Follow docs/runbooks/restore-drill.md: restore nutrivo-prod into a new project from the dashboard, then run Actions → restore-drill. Close this issue when the drill has passed."

  drill:
    if: github.event_name == 'workflow_dispatch'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The production identity can delete a project: only a repository admin (a founder) may start this.
      - name: Started by a founder
        id: founder
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq .permission)
          [ "$perm" = admin ] || { echo "::error::only a repository admin may run the restore drill ($GITHUB_ACTOR is $perm)"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/infisical
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          env-slug: prod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # SUPABASE_ACCESS_TOKEN (Infisical prod, scoped to nutrivo-prod) reads prod. SUPABASE_DRILL_ACCESS_TOKEN makes
      # every call on the copy, the delete included (#392): a per-drill token scoped to the copy only, kept as a
      # production environment secret that only this job reads, never in Infisical (docs/runbooks/restore-drill.md).
      - name: Drill
        id: drill
        env:
          SUPABASE_DRILL_ACCESS_TOKEN: ${{ secrets.SUPABASE_DRILL_ACCESS_TOKEN }}
          DRILL_REF: ${{ inputs.drill_ref }}
          RESTORE_POINT: ${{ inputs.restore_point }}
        # Wrapped in a check-in to the Sentry monitor (DSN-authorised, like synthetic.yml): a failed drill is an error
        # check-in, and a month without one is a missed check-in (schedule the 1st, margin 14 days, runtime 60 min).
        run: >
          SENTRY_DSN="$SENTRY_DSN_WEB" npx --yes @sentry/cli@3.8.0 monitors run -e prod
          -s "0 9 1 * *" --check-in-margin 20160 --max-runtime 60 restore-drill-prod --
          python3 scripts/drill/restore_drill.py --drill-ref "$DRILL_REF" --restore-point "$RESTORE_POINT"
          ${{ inputs.keep && ' ' || '--delete' }} --json drill.json
      # Only a drill that ran is recorded: a refused start (not a founder) or a failed setup records nothing.
      - name: Record the drill
        if: ${{ !cancelled() && steps.founder.outcome == 'success' && steps.drill.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.drill.outcome }}
        run: |
          gh label create restore-drill --repo "$GITHUB_REPOSITORY" --color 0e8a16 --force >/dev/null
          result=$([ "$OUTCOME" = success ] && echo passed || echo FAILED)
          body="Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID by @$GITHUB_ACTOR."
          if [ -f drill.json ]; then body="$body"$'\n\n'"$(PYTHONPATH=scripts/drill python3 -c 'import json, restore_drill as r; print(r.markdown(json.load(open("drill.json"))))')"; fi
          labels=restore-drill; [ "$result" = passed ] || labels="restore-drill,needs-human"
          url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "Restore drill $(date -u +%Y-%m-%d): $result" \
            --label "$labels" --body "$body")
          # a passing drill is a record, not work: close it at once
          if [ "$result" = passed ]; then gh issue close "$url" --repo "$GITHUB_REPOSITORY" --reason completed >/dev/null; fi
          echo "$url"
