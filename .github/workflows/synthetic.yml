name: synthetic
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  smoke-prod:
    if: vars.SYNTHETIC_ENABLED == 'true'      # switched on in T-1102
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Infisical/secrets-action@v1          # pin to a commit SHA in T-004
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          env-slug: prod
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx --yes @sentry/cli monitors run synthetic-smoke-prod -- make smoke ENV=prod
