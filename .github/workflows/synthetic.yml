name: synthetic
# T-1102 (docs/17, docs/19, docs/22 §4): production's critical paths every 15 minutes, only once an organisation owner
# sets the repository variable SYNTHETIC_ENABLED to true; until then the job is skipped and nothing runs. The check
# (scripts/synthetic/check.py) reads /api/health, /sign-in and the verify Edge Function (public.verify_reference),
# and checks in to the Sentry monitor synthetic-smoke-prod: a failed run is an error check-in, a run that does not
# happen is a missed one, and either opens an issue routed by config/sentry-alerts.yaml.
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch:
concurrency: { group: synthetic, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  smoke-prod:
    if: vars.SYNTHETIC_ENABLED == 'true'
    environment: production                    # the prod Infisical identity is an environment secret
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/infisical
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          domain: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
          env-slug: prod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # An exact version: this runs beside every prod secret. The check-in authenticates with the web project's DSN.
      # The schedule, margin and runtime are config/monitors.yaml's (scripts/monitors/test_monitors.py compares them).
      - name: Critical paths, inside the synthetic-smoke-prod check-in
        run: >
          SENTRY_DSN="$SENTRY_DSN_WEB" npx --yes @sentry/cli@3.8.0 monitors run -e prod
          -s "*/15 * * * *" --check-in-margin 10 --max-runtime 10 --failure-issue-threshold 1 --recovery-threshold 1
          synthetic-smoke-prod -- python3 scripts/synthetic/check.py
