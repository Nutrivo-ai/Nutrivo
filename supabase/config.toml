# Local development settings. Hosted projects must match: Dashboard → API → Exposed schemas = public, app, ref.
project_id = "nutrivo"

[api]
schemas = ["public", "graphql_public", "app", "ref"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17   # the gates are proven on 17; nutrivo-staging and nutrivo-prod must run 17 as well

[db.seed]
enabled = false   # reference data is seeded by migrations so production gets it too

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = true

[auth.email]
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# D-27 (T-109): no new account for a consumer or free-mail address, whatever the route. Hosted projects set the same
# hook in the dashboard (Authentication → Hooks → Before User Created → Postgres, private.before_user_created_hook).
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/private/before_user_created_hook"

# D-27: Continue with Google and Continue with Microsoft. Local credentials come from Infisical dev through
# scripts/env/run.sh dev -- supabase start; hosted projects keep their own in the dashboard. Microsoft is limited to
# work and school accounts by the organizations tenant.
[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_CLIENT_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"
skip_nonce_check = false

[auth.external.azure]
enabled = true
client_id = "env(AZURE_OAUTH_CLIENT_ID)"
secret = "env(AZURE_OAUTH_CLIENT_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"
url = "https://login.microsoftonline.com/organizations"

[storage]
file_size_limit = "50MiB"
