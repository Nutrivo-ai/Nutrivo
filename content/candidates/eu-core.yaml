# First extraction targets for the EU core ruleset (K01/K02). NOT accepted content.
# Each 'candidate_source' was written without web access on 8 Oct 2026 and corrected on 23 Oct 2026 against the
# consolidated texts 02009R0767-20181226 and 01976L0211-20190726 (docs/14 §7): the article and paragraph only. A
# person still confirms them against the stored source before extraction is accepted. Values (thresholds, terms,
# heights) must come from the extraction, never from this file.
targets:
  - key: EU.767.TYPE_OF_FEED
    shape: prescribed_wording
    domain: mandatory_particulars
    candidate_source: Reg. 767/2009, Art. 15(a) (type of feed)
    extract: The prescribed designations (complete / complementary feed and any pet-food alternatives) per language
  - key: EU.767.OPERATOR
    shape: mandatory_particular
    domain: mandatory_particulars
    candidate_source: Reg. 767/2009, Art. 15(b) (name or business name and address of the operator responsible for labelling)
  - key: EU.767.ESTABLISHMENT_NUMBER
    shape: mandatory_particular
    domain: mandatory_particulars
    candidate_source: Reg. 767/2009, Art. 15(c) (establishment approval number, if available, with Reg. 183/2005 Art. 10) and Art. 17(1)(c) (the producer's name or number where the producer is not the person responsible for labelling)
  - key: EU.767.BATCH
    shape: mandatory_particular
    domain: mandatory_particulars
    candidate_source: Reg. 767/2009, Art. 15(d) (batch or lot reference number)
  - key: EU.767.NET_QUANTITY
    shape: mandatory_particular
    domain: mandatory_particulars
    candidate_source: Reg. 767/2009, Art. 15(e) (net quantity and units)
  - key: EU.767.ADDITIVES_DECLARATION
    shape: mandatory_particular
    domain: composition
    candidate_source: Reg. 767/2009, Art. 15(f) with Annex VII Chapter I (non-food producing animals), as amended by Reg. 2017/2279 and Reg. 2018/1903
    extract: The "additives" heading per language and which additives pet food must declare
  - key: EU.767.MOISTURE
    shape: threshold
    domain: composition
    candidate_source: Reg. 767/2009, Art. 15(g) with Annex I point 6 (moisture content declaration)
    extract: The moisture level above which declaration is required for compound feed
  - key: EU.767.SPECIES_AND_USE
    shape: mandatory_particular
    domain: mandatory_particulars
    candidate_source: Reg. 767/2009, Art. 17(1)(a) (species or category) and 17(1)(b) (instructions for proper use, with Annex II point 4 where applicable)
  - key: EU.767.COMPOSITION
    shape: mandatory_particular
    domain: composition
    candidate_source: Reg. 767/2009, Art. 17(1)(e) (composition list, descending order by weight) and 17(2)(c) (designation by category for non-food producing animals)
  - key: EU.767.ANALYTICAL_CONSTITUENTS
    shape: mandatory_particular
    domain: composition
    candidate_source: Reg. 767/2009, Art. 17(1)(f) with Annex VII Chapter II, as amended by Reg. 2017/2279
    extract: The analytical constituents pet food must declare, by product type, with the heading per language
  - key: EU.767.MINIMUM_STORAGE_LIFE
    shape: mandatory_particular
    domain: mandatory_particulars
    candidate_source: Reg. 767/2009, Art. 17(1)(d) (minimum storage life)
  - key: EU.767.PET_FOOD_CONTACT
    shape: mandatory_particular
    domain: mandatory_particulars
    candidate_source: Reg. 767/2009, Art. 19 (free telephone number or other appropriate means of communication, for information on additives and on feed materials designated by category)
  - key: EU.767.EMPHASIS_PERCENTAGE
    shape: threshold
    domain: claims_wording
    candidate_source: Reg. 767/2009, Art. 17(2)(a) (name and percentage when labelling emphasises a feed material)
  - key: EU.767.LANGUAGE
    shape: mandatory_particular
    domain: language
    candidate_source: Reg. 767/2009, Art. 14(1) (official language or languages of the Member State of marketing)
  - key: EU.767.CLAIMS_GENERAL
    shape: claim_judgement
    domain: claims_wording
    candidate_source: Reg. 767/2009, Art. 11(1) (no misleading labelling) and Art. 13(3)(a) (no prevention, treatment or cure claims, with the exceptions in that paragraph)
    note: Needs the claims evaluation harness (docs/07-ai.md) before it can join a ruleset
  - key: EU.1831.ADDITIVE_AUTHORISED
    shape: additive_condition
    domain: composition
    candidate_source: Reg. 1831/2003 and the EU Register of Feed Additives
    extract: Authorisation for the target species, maximum contents and conditions per declared additive
  - key: EU.76-211.FIGURE_HEIGHT
    shape: character_height
    domain: type_geometry
    candidate_source: Dir. 76/211/EEC, Annex I point 3.1, as amended (minimum height of the figures of the nominal quantity)
    extract: The quantity bands and minimum figure heights; confirm the Directive applies to the products in scope (Art. 1 limits it to prepackages in constant nominal quantities, and Art. 3 ties compliance to the EEC sign)
