# Every screen in design/: written by task T-012 from the design files, then frozen at gate G4 (docs/20 §2).
# `pnpm --dir apps/web baselines` captures each baseline from the design file; apps/web/src/lib/screens/inventory.test.ts
# checks this file against design/ and docs/workflows/.
#
# One entry per frame the design files draw:
#   id          S-<FILE>-<NNN>; the prefix abbreviates the design file (DOC: the three documents)
#   title       the frame's name in its design file
#   kind        app (workspace route) · admin (staff /admin) · auth (before a workspace) · public (no account) ·
#               moment (a state or dialog shown inside another route) · email · document (PDF) ·
#               catalogue (a sheet of patterns or examples, not a route)
#   design      the design file under design/
#   state       the design's own component state that shows the frame (what its rail, tab or step sets); {} = default
#   element     optional: a CSS selector and index; the baseline is that element instead of the full page
#   route       proposed route (see open question Q1); null when the frame is not a route of its own
#   role        lowest role that sees it: anon · authenticated (signed in, any workspace or none) · viewer · editor ·
#               portfolio_manager · admin (app.memberships.role) · staff (app_metadata.nutrivo_staff) ·
#               supplier_link (a document request token) · none (not a page)
#   scope       build (an MVP workflow uses it) or later (only LATER workflows use it; docs/workflows/README.md)
#   viewports   widths in px the baseline is captured at: 1600 desktop, 390 the Mobile file's phones
#   workflows   docs/workflows ids the frame serves ([] when no workflow names it; see its notes)
#   data        tables, views, functions and Edge Functions it reads or calls (docs/03, docs/04)
#   states      states the built screen must render: loaded · empty · loading · error · no-permission · rendered
#   baseline    the captured image
#   notes       what design/ leaves open; decided at G4, never by the build
#
# Open questions for gate G4 (issue #21, label needs-human). The conservative choice below is what this file records.
#   Q1 Routes and roles are written down nowhere (spec/, docs/workflows/, docs/02). Every route and role here is a
#      proposal following the /w/[workspace]/... convention of the original header, until a founder confirms it.
#   Q2 390 px: the Mobile file draws its phones about 284 px wide inside a 300 px frame. Each phone baseline is an
#      element screenshot at the drawn size; whether a 390 px route is scaled before comparison is open.
#   Q3 Nutrivo 2.0 shows the Compliance Worker panel open on every screen by default, and its baselines keep it open.
#      The Worker is LATER (L01-L03): whether route baselines are re-captured with the panel closed is open.
#   Q4 Five Nutrivo 2.0 rail entries and four other frames are catalogues of patterns, not routes; they are listed with
#      route null so the frontend can still compare its components with them.
#   Q5 Marketing Site ("site structure") overlaps Landing Page ("one page"); / is proposed to build from Landing Page.
#
# Not inventoried, because they are not screens: index.dc.html (the set's index), build/ (handoff, registers, priced
# ladder: reference documents) and brand/ (the Cobalt specification: tokens and glyphs, docs/10).
