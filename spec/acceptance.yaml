      A02.must.1: An expired or ended membership gives no access (BE-03).
      A02.must.2: Signing always requires aal2.
      A02.fail.1: 'Membership ended: ''access removed'' page (Account Recovery design).'
      A02.fail.2: 'Signer without TOTP: enrol before signing.'
  A03:
    name: Invite a member
    scope: BUILD
    milestone: M1
    tests:
      A03.main: 'Invite a member: the main path works end to end'
      A03.must.1: Only admins invite.
      A03.must.2: The raw token is never stored.
      A03.must.3: Viewers never use a seat; external editors do.
      A03.fail.1: 'No seat left: P0033, then the upsell from Plans and Checkout.'
      A03.fail.2: 'A pending invitation exists: resend, never duplicate.'
